# Ash PSP-est: coefficients of the PSP-3000 cost model (the ONLY place they live).
# Format: key = value   # source / tag.   Units: ns at GE/bus 166 MHz and CPU 333 MHz unless the key says otherwise.
# Tags: [MEAS] measured on a real PSP by someone else (source named), [CODE] constant from PPSSPP source,
#       [SPEC] official spec, [оценка] my guess until tools/perf/calibrate.py replaces it with a fit to our bench.
# Build: tools/perf/cfg2h.py turns this file into perf_cost_gen.h (defaults compiled in). At runtime a file
# psp_cost.cfg next to the EBOOT overrides any key (no rebuild needed after calibration).
# Docs: docs/psp-cost-model.md.  calibrated = 0 means: nothing here has been fitted to our own hardware numbers yet.
calibrated = 0

# ---------------------------------------------------------------- GE: command processor
ge_list_ns = 360            # list start + END: PPSSPP charges 60+60 CPU ticks @333 [CODE GPUCommon.cpp, guess]
ge_cmd_ns = 12              # per command word: PPSSPP 2 ticks (=6 ns @333); x2 for fetch from RAM [оценка]
ge_prim_ns = 150            # per PRIM (draw call) setup on the GE side [оценка]

# ---------------------------------------------------------------- GE: vertex stage (one transform per index - no post-transform cache [версия])
ge_vert_ns = 60             # base per processed vertex: PPSSPP 20 ticks @222 = 90 ns -> x2/3 @166 bus [CODE, "pure guesswork"]
ge_vert_byte_ns = 0.75      # per vertex/index byte fetched: 128-bit bus @166 MHz = 2.66 GB/s peak (0.38 ns/B) x2 for real traffic [SPEC + оценка]
ge_weight_ns = 6            # per skinning weight (one 4x3 matrix-vector blend each) [оценка]
ge_light_ns = 30            # lighting on: PPSSPP +10 ticks @222 [CODE guess]
ge_light_each_ns = 21       # per enabled light: PPSSPP +7 ticks @222 [CODE guess]
ge_tri_ns = 40              # triangle setup per assembled triangle, also culled/clipped ones [оценка]

# ---------------------------------------------------------------- GE: pixel stage
ge_pix_ns = 2.51            # per written pixel, 16-bit colour: full-screen clear 0.49 ms @222 = 3.77 ns/px -> x2/3 [MEAS pspautotests blittiming via PPSSPP]
ge_pix_zread_ns = 1.25      # depth test: read 16-bit Z [оценка: half a 16-bit write]
ge_pix_zwrite_ns = 1.25     # depth write [оценка]
ge_pix_blend_ns = 2.5       # alpha blending: read-modify-write of the frame buffer [оценка; blit test saw no blend cost for 1:1 sprites]
ge_pix_32bit_mul = 1.41     # 8888 frame buffer vs 5650: clear 0.69/0.49 ms [MEAS]
ge_clear_px_ns = 2.51       # clear-mode pixel (colour+Z16): 0.49 ms full screen @222 -> x2/3 [MEAS]
ge_tex_px_ns = 1.0          # textured pixel: sampler/CLUT lookup overhead [оценка]
ge_tex_vram_byte_ns = 1.51  # per texel byte from VRAM: (8.3-3.77)/2 ns @222 x2/3, 1:1 unswizzled 16-bit sprite [MEAS-derived]
ge_tex_ram_byte_ns = 10.4   # per texel byte from main RAM: (34.9-3.77)/2 ns @222 x2/3 [MEAS-derived]
ge_tex_ram_contention = 1.17 # RAM texture fetch slower in a running game (CPU/ME/audio on the bus) [MEAS PPSSPP comment]
ge_tex_bilinear_mul = 1.3   # bilinear filter fetches more texels at edges of 16-byte blocks (below the line cap) [оценка]
ge_tex_unswizzled_mul = 2.0 # unswizzled texture on arbitrary 3D triangles (blit test: wide strips 7.2x worse) [оценка]
ge_tex_ratio_min = 0.25     # texel bytes per pixel never go below 1/4 of a texel (magnified textures reuse cache lines) [оценка]
ge_tex_line_bytes = 16      # cap of texel bytes per pixel: a minified texture (no mipmaps) thrashes the 8 KB texture cache and
                            # every pixel costs ~one 16-byte line. Wide-sprite blit: 253 ns/px @222 = 16 B x 15.6 ns/B [MEAS-derived]
ge_tex_bind_ns = 600        # texture change: cache flush + first fill latency [оценка]
ge_clut_byte_ns = 1.5       # CLUT upload per byte (CLOAD), mostly from RAM [оценка]
ge_overlap = 0.25           # per draw: max(vertex, pixel) + overlap*min(...) - the GE pipelines both stages [оценка]

# ---------------------------------------------------------------- CPU
cpu_k = 1.8                 # real Allegrex time / PPSSPP emulated time. PPSSPP counts 1 cycle per instruction (VFPU 2, div.s 29)
                            # [CODE MIPSTables.cpp]; real CPU stalls on cache misses, load-use, FPU latency [оценка 1.5-2.5]
cpu_target_mhz = 333        # estimates are also printed for this clock
bus_target_mhz = 166
frame_overlap = 1           # 1: GE runs the DIRECT list while the CPU still builds it (sceGuDrawArray updates the stall address
                            # [проверено psp-nm libpspgu.a]); frame = max(cpu, cpu_before_list + ge). 0: cpu + ge
vblank_hz = 59.94

# ---------------------------------------------------------------- memory (plan §4.1)
mem_profile = 32            # 32: ~24 MB user partition (PSP-1000, or 2000/3000 without MEMSIZE=1); 64: extended
mem_user_kb_32 = 24576      # user partition 0x08800000-0x0A000000 [SPEC; PPSSPP the same, MemMap.h]
mem_user_kb_64 = 57344      # extended partition 0x08800000-0x0C000000 [PPSSPP MemMap.h; community says ~52 MB usable - версия]
mem_hw_minus_emu_kb = 0     # how much less free RAM a real PSP gives than PPSSPP at the same point (user modules of CFW etc.)
                            # [оценка 0 until calibrate.py compares bench mem.maxfree_kb emulator vs hardware]
mem_reserve_kb = 2048       # plan §4.1 build gate
mem_enforce = 0             # 1: allocate a heap ballast at start so malloc fails where the real PSP would
mem_probe_every = 60        # frames between free-heap probes (0 = off)

# ---------------------------------------------------------------- budgets (plan §4.3 / §4.4) -> warnings in the log
budget_tris = 22000
budget_draws = 250
budget_tex_changes = 60
budget_ge_ms = 30
budget_cpu_ms = 18.5
budget_tex_max = 512        # GE hardware limit for a texture side
budget_bones = 8            # bone matrices per draw (GE limit 8)

# ---------------------------------------------------------------- runtime switches
overlay = 1                 # 2 lines in the bottom-left corner
log_every = 1               # PSPEST line every N frames (0 = only per-second summaries)
analyze_every = 1           # walk the GE lists only every Nth frame (route runs: 15-30); the others cost nothing
log_draws = 0               # 1: one PSPEST-D line per draw (feature dump for calibrate.py)
coverage = 1                # transform vertices on the CPU to count covered pixels (0: pixel cost not estimated)
cull_flip = 0               # 1 if the back-face test turns out inverted (see docs)
